name: 🔄 BDPM — mise à jour automatique

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 5 * *"
  push:
    branches: [master]
    paths-ignore:
      - medicaments.json

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vérifier la syntaxe
        run: python -m py_compile import_bdpm.py

      - name: Télécharger et importer la BDPM
        run: python import_bdpm.py

      - name: Vérifier la base générée
        run: |
          python - <<'PY'
          import json
          with open("medicaments.json", encoding="utf-8") as f:
              data=json.load(f)
          meds=data.get("medicaments", [])
          print("Spécialités :", len(meds))
          print("Avec présentations :", sum(bool(m.get("presentations")) for m in meds))
          if len(meds) < 1000:
              raise SystemExit("La base BDPM semble incomplète.")
          PY

      - name: Commit si changement
        run: |
          git config user.name "medicalc-bdpm-bot"
          git config user.email "actions@github.com"
          git add medicaments.json
          if git diff --cached --quiet; then
            echo "Aucune modification."
          else
            git commit -m "chore: mise à jour automatique BDPM"
            git push origin master
          fi
