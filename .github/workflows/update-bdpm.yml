name: 🔄 Téléchargement automatique BDPM

on:
  push:
    branches:
      - master
    paths-ignore:
      - medicaments.json
  schedule:
    - cron: "30 3 5 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-bdpm:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer Médicalc
        uses: actions/checkout@v4
        with:
          ref: master

      - name: 🐍 Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 🔎 Vérifier la syntaxe
        run: python -m py_compile import_bdpm.py

      - name: 📦 Télécharger automatiquement la BDPM
        run: python import_bdpm.py

      - name: ✅ Vérifier la base
        run: |
          python -m json.tool medicaments.json > /dev/null
          python - <<'PY'
          import json
          with open("medicaments.json", encoding="utf-8") as f:
              data = json.load(f)
          count = len(data.get("medicaments", []))
          print(f"BDPM importée : {count} spécialités")
          if count < 100:
              raise SystemExit("Import BDPM incomplet.")
          PY

      - name: 💾 Enregistrer la nouvelle base
        run: |
          git config user.name "medicalc-bdpm-bot"
          git config user.email "actions@github.com"
          git add medicaments.json

          if git diff --cached --quiet; then
            echo "Aucune modification de la BDPM."
          else
            git commit -m "chore: mise à jour automatique BDPM"
            git push origin master
          fi
